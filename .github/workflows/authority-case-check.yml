name: AuthorityCase Check

# Ported from the council repository's authority-case-check workflow with the same
# semantics: the PR body's AuthorityCase (or legacy cc-task) reference is parsed and
# validated, and changes to protected governance paths are named. The release arm requires
# a SUCCESS check named authority-case-check for governance- and public-claim-flagged rows.
# The logic lives in .github/scripts/authority-case-check.sh, tested by
# api/test_authority_case_check.py; only the protected-path list is Reins' own.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  authority-case-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Parse AuthorityCase reference from PR body
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/authority-case-check.sh parse

      - name: Validate case reference
        env:
          CASE_ID: ${{ steps.parse.outputs.case_id }}
          SLICE_ID: ${{ steps.parse.outputs.slice_id }}
          PRE_METHODOLOGY: ${{ steps.parse.outputs.pre_methodology }}
          CC_TASK: ${{ steps.parse.outputs.cc_task }}
        run: bash .github/scripts/authority-case-check.sh validate

      - name: Check protected paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/authority-case-check.sh paths
