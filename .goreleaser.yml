# GoReleaser — prebuilt cross-platform reins binaries + a GitHub release (the 5-min, no-compiler path).
# `goreleaser release --clean` on a tag; `goreleaser build --snapshot --clean` locally.
version: 2

project_name: reins

before:
  hooks:
    - go mod tidy

builds:
  - id: reins
    main: ./cmd/reins
    binary: reins
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # main.version is the ONE semver source (VERSION file / ldflag) — stamp the release tag.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: reins
    formats: [tar.gz]
    name_template: "reins_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - config.example.toml

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: hapax-systems
    name: reins
  # reins provides the read and command-preview terminal cockpit; --demo runs offline on bundled fixtures.
  header: |
    ## reins {{ .Version }}
    Terminal cockpit and read/command-preview front door for the Hapax Research Lab governed agent-delivery system.
    Run offline on bundled fixture data with `reins --demo`. Source-available under BSL-1.1 (converts to Apache-2.0 on the Change Date).
  footer: |
    Current release scope: read and command-preview navigation lenses; write commands render preview envelopes without mutating state. See `README.md` and `NOTICE.md`.

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
