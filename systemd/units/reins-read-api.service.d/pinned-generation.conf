# reins-read-api.service.d/pinned-generation.conf
#
# Point the operator's only frontdoor API at a tested generation instead of at whatever
# branch a developer last checked out.
#
# The base unit ExecStarts from ~/projects/reins/api — a mutable developer checkout.
# Measured 2026-08-12: that tree was on `beta/k0-closed-world-harvest-20260812` while the
# live process served 943e6d8 (Aug-9 main). It was serving good code only because nothing
# had restarted it since 2026-08-09 11:59. The next restart, for any reason, would have
# loaded the feature branch. `scripts/reins-release <sha>` builds an immutable generation
# under ~/.local/share/reins/releases/<sha> and flips `current` to it only once that
# generation has proved its own tests pass; this drop-in is what makes the service
# actually read that pin.
#
# INSTALL ORDER MATTERS — a generation must exist before this file does:
#
#   reins-release "$(git -C ~/projects/reins rev-parse origin/main)"
#   mkdir -p ~/.config/systemd/user/reins-read-api.service.d
#   cp systemd/units/reins-read-api.service.d/pinned-generation.conf \
#      ~/.config/systemd/user/reins-read-api.service.d/
#   systemctl --user daemon-reload && systemctl --user restart reins-read-api
#
# Runbook, including rollback and the failed-assertion case: docs/reins-pinned-generation.md

[Unit]
# If `current` is missing, the frontdoor must FAIL — loudly, in `systemctl status`.
# Assert, not Condition: a failed Condition makes systemd SKIP the unit and report
# success-by-omission, which is the one outcome worse than being down, because the
# operator would see no API and no error. A failed Assert lands the unit in `failed`
# with a message naming the missing path, which is its own next action.
AssertPathExists=%h/.local/share/reins/current/api/reins_serve.py

[Service]
# The empty assignment is required: ExecStart= is a list, and without the reset systemd
# rejects the unit for declaring two ExecStart lines under Type=exec.
ExecStart=
ExecStart=%h/.local/share/reins/current/api/.venv/bin/python %h/.local/share/reins/current/api/reins_serve.py
WorkingDirectory=%h/.local/share/reins/current/api

# PYTHONPATH is the part that is easy to miss, and leaving it would have kept the whole
# defect alive under a new name. The base unit sets PYTHONPATH=%h/projects/reins/api, so
# even with ExecStart pinned, any module present in the developer checkout but absent from
# the generation stays importable from the mutable tree. sys.path[0] is the script's own
# directory, so same-named modules resolve inside the generation and the leak stays
# invisible in exactly the cases anyone would think to test — it bites only for a file
# some branch adds. Pin it to the generation. (Environment= is cumulative and
# last-assignment-wins per variable, so this overrides PYTHONPATH alone and leaves the
# other five settings of the base unit intact.)
Environment=PYTHONPATH=%h/.local/share/reins/current/api

# NOT overridden, deliberately: REINS_COUNCIL_ROOT and HAPAX_SPINE_CONFIG_DIR still point
# at ~/projects/hapax-council. Those name the estate DATA this API reads — live tasks,
# live config — and pinning them to a snapshot would make the frontdoor answer about a
# frozen estate. The subject here is the code that serves, not the state it reads.
